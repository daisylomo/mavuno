[project]
name = "mavuno-backend"
version = "0.1.0"
description = "Backend API for the Mavuno marketplace"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115.12,<1.0",
    "pydantic-settings>=2.9.1,<3.0",
    "pyyaml>=6.0.2,<7.0",
    "supervisor>=4.2.5,<5.0",
    "uvicorn>=0.34.2,<1.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.0,<3.0",
    "mypy>=1.15.0,<2.0",
    "pytest>=8.3.5,<9.0",
    "pytest-cov>=6.1.1,<7.0",
    "ruff>=0.11.8,<1.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov=mavuno --cov-report=term-missing"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["mavuno"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "yaml"
ignore_missing_imports = true
