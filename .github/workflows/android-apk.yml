name: Android APK

# The APK contains only the frontend, so backend changes neither rebuild it nor are re-verified
# here; "Backend CI" covers them on pull requests and "Backend deployment" on main.
on:
  pull_request:
    paths:
      - frontend/**
      - .github/workflows/android-apk.yml
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - frontend/**
      - .github/workflows/android-apk.yml
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request supersedes its previous run; main and tag builds always finish.
concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Release notes promise backend checks passed, so only tagged releases re-verify the backend.
  backend:
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/backend-ci.yml

  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: node --experimental-strip-types --test tests/*.test.mjs

  build:
    needs: [verify, backend]
    # `backend` is skipped except for tags; a skipped need must not block the build.
    if: >-
      !cancelled() && github.event_name != 'pull_request'
      && needs.verify.result == 'success'
      && (needs.backend.result == 'success' || needs.backend.result == 'skipped')
    runs-on: ubuntu-latest
    env:
      MAVUNO_RELEASE_BUILD: '1'
      EXPO_PUBLIC_MAVUNO_API_URL: https://mavuno-api.onrender.com/api/v1
      EXPO_PUBLIC_MAVUNO_PAYMENTS_SANDBOX: '1'
      # RevenueCat's public Android SDK key (goog_...), never the secret sk_ key: it ships in the APK.
      EXPO_PUBLIC_REVENUECAT_API_KEY: ${{ secrets.REVENUECAT_ANDROID_API_KEY }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Require the RevenueCat key for releases
        run: |
          if [ -n "$EXPO_PUBLIC_REVENUECAT_API_KEY" ]; then
            case "$EXPO_PUBLIC_REVENUECAT_API_KEY" in
              sk_*) echo "::error::REVENUECAT_ANDROID_API_KEY is a secret key; use the public goog_ SDK key."; exit 1 ;;
              test_*)
                # RevenueCat Test Store keys only work in debug builds; release APKs show "Wrong API key".
                if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
                  echo "::error::REVENUECAT_ANDROID_API_KEY is a Test Store key; releases need the Google Play goog_ key."; exit 1
                fi
                echo "::warning::REVENUECAT_ANDROID_API_KEY is a Test Store key; this release-mode APK will report a wrong API key." ;;
            esac
            echo "RevenueCat SDK key is configured."
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "::error::REVENUECAT_ANDROID_API_KEY is not set; a release without it cannot sell Premium."
            exit 1
          else
            echo "::warning::REVENUECAT_ANDROID_API_KEY is not set; this test APK cannot sell Premium."
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install
      - name: Build test APK
        run: cd android && ./gradlew :app:assembleRelease --no-daemon --max-workers=2
      - name: Check APK
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          unzip -tqq "$APK"
          unzip -Z1 "$APK" | grep '^classes.dex$'
          mkdir -p dist-ci
          cp "$APK" "dist-ci/mavuno-test-${GITHUB_SHA:0:12}.apk"
          cd dist-ci && sha256sum *.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: mavuno-android-apk-${{ github.sha }}
          path: frontend/dist-ci/*
          if-no-files-found: error
          retention-days: 14

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: mavuno-android-apk-${{ github.sha }}
          path: dist
      - name: Attach APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --prerelease
          else
            gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --prerelease --title "Mavuno $GITHUB_REF_NAME (sandbox)" --notes "Android release candidate using sandbox M-Pesa and test signing. No real payments are collected. Backend and frontend checks passed before this APK was built. SHA256SUMS.txt verifies the download. Production requires production Daraja credentials, durable release signing, and live payment validation."
          fi
