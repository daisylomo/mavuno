name: Backend CI

# Runs once per change: directly on pull requests, and on main only through "Backend deployment",
# which calls this workflow before deploying. Android releases call it for tagged builds only.
on:
  pull_request:
    paths: ["backend/**", "api_client/**", ".github/workflows/backend-ci.yml"]
  push:
    branches: [backend]
    paths: ["backend/**", "api_client/**", ".github/workflows/backend-ci.yml"]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# A new push to a pull request supersedes its previous run. Other runs (including calls from
# other workflows) get a unique group so they are never cancelled.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('backend-ci-{0}-{1}', github.workflow, github.ref) || github.run_id }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: mavuno_test
          MYSQL_USER: mavuno
          MYSQL_PASSWORD: test-password
          MYSQL_ROOT_PASSWORD: root-test-password
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=5s --health-timeout=5s --health-retries=20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=5s --health-retries=20
    defaults:
      run:
        working-directory: backend
    env:
      MAVUNO_TEST_DATABASE_URL: mysql+aiomysql://mavuno:test-password@127.0.0.1:3306/mavuno_test?charset=utf8mb4
      MAVUNO_TEST_REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run alembic -c conf/alembic.ini upgrade head
        env:
          MAVUNO_DATABASE_URL: ${{ env.MAVUNO_TEST_DATABASE_URL }}
      - run: uv run pytest
      - name: Test Python API client against the running backend
        env:
          MAVUNO_DATABASE_URL: ${{ env.MAVUNO_TEST_DATABASE_URL }}
          MAVUNO_API_BASE_URL: http://127.0.0.1:8000/api/v1
          MAVUNO_AUTH_REGISTER_RATE_LIMIT: '1000'
          MAVUNO_AUTH_LOGIN_RATE_LIMIT: '1000'
          PYTHONPATH: src:..
        run: |
          uv run uvicorn mavuno.main:app --app-dir src --host 127.0.0.1 --port 8000 > /tmp/mavuno-api.log 2>&1 &
          API_PID=$!
          trap 'kill "$API_PID"' EXIT
          curl --fail --retry 15 --retry-connrefused --retry-delay 1 http://127.0.0.1:8000/health/ready
          uv run pytest ../api_client/tests --no-cov
      - run: uv run python scripts/export_openapi.py /tmp/openapi.json
      - run: diff -u tests/contracts/openapi.json /tmp/openapi.json
      - run: docker build --tag mavuno-backend:${{ github.sha }} .
      - name: Scan runtime image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: mavuno-backend:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivyignores: backend/conf/trivy.ignore.yaml
          exit-code: "1"
